name: Lottery diagnostic 3D visual candidate (not G3 pass)
on:
  push:
    branches: [lottery-shop-g0-20261011]
    paths: [tasks/lottery-shop/ci/visual-candidate-request.json]
permissions:
  contents: read
concurrency:
  group: unity-personal-proof
  cancel-in-progress: false
jobs:
  visual-candidate:
    name: Native 3D candidate frames then unchanged regression identities
    if: >-
      github.event_name == 'push' && github.repository == 'yangerstar1/task-workbench' &&
      github.repository_owner == 'yangerstar1' && github.actor == 'yangerstar1' &&
      github.triggering_actor == 'yangerstar1' && github.ref == 'refs/heads/lottery-shop-g0-20261011' &&
      github.event.repository.private == false && github.event.repository.fork == false && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      android_requested: ${{ steps.guard.outputs.android_requested }}
      capture_outcome: ${{ steps.capture.outcome }}
      cleanup_outcome: ${{ steps.nativefinish.outcome }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tasks/lottery-shop/
            /.github/workflows/lottery-visual-candidate.yml
            /.github/workflows/lottery-activation-probe.yml
      - name: Validate separate diagnostic request, never old G3 source approval
        id: guard
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py guard
      - name: Run diagnostic evidence validator synthetic tests
        if: ${{ steps.guard.outputs.execution_profile != 'ART_ONLY_DIAGNOSTIC' }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_visual_candidate_ci.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_android_candidate_ci.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_activation_probe.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_safe_project_ci.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_play_split_ci.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_world_progress_ci.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_reflection_bake_ci.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_reflection_progress_ci.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_startup_progress_ci.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_material_initialization_ci.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_diagnostic_early_stop_ci.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_independent_g3_frames_ci.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_diagnostic_extensions_ci.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -S tasks/lottery-shop/scripts/test_counter_light_prepare_ci.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_stage_a_combined_receipt_ci.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/export_interior_meta.py --self-test
      - name: Check the closed art-only selector, NOT_RUN semantics and cleanup scheduling
        if: ${{ steps.guard.outputs.execution_profile == 'ART_ONLY_DIAGNOSTIC' }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/test_art_only_capture_ci.py -v
      - name: Prepare existing authorized disposable runner disk layout
        run: |
          python3 tasks/lottery-shop/scripts/visual_candidate_ci.py guard
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          python3 - <<'PY'
          import shutil
          if shutil.disk_usage('.').free < 30*1024**3:
              raise SystemExit('Need at least 30 GiB for cold pinned Unity image')
          PY
      - name: Read pinned public command inputs without running the raw-logging action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: game-ci/unity-test-runner
          ref: 0ff419b913a3630032cbe0de48a0099b5a9f0ed9
          path: .visual-safe-upstream
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            dist/BlankProject
            dist/unity-config
            dist/platforms/ubuntu
      - name: Restore same verified licensed font and hash source metadata
        run: |
          python3 tasks/lottery-shop/scripts/visual_candidate_ci.py restore-font
          python3 tasks/lottery-shop/scripts/visual_candidate_ci.py snapshot
      - name: Bind art-only capture to the exact reviewed source contract before activation
        id: artprepare
        if: ${{ steps.guard.outputs.execution_profile == 'ART_ONLY_DIAGNOSTIC' }}
        timeout-minutes: 1
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/art_only_capture_ci.py prepare
      - name: Bind counter-light diagnostic to the reviewed cold source before native preparation
        id: counterlightprepare
        if: ${{ steps.guard.outputs.execution_profile != 'ART_ONLY_DIAGNOSTIC' }}
        timeout-minutes: 5
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/counter_light_diagnostics/compose_evidence.py prepare --repo-root "$GITHUB_WORKSPACE"
      - name: Verify pinned image measurement dependencies before any native activation
        id: counterlightdeps
        if: ${{ steps.guard.outputs.execution_profile != 'ART_ONLY_DIAGNOSTIC' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo COUNTER_LIGHT_DEPENDENCY_SETUP_FAILED_BEFORE_NATIVE >&2' ERR
          LIGHT_ENV="$RUNNER_TEMP/lottery-counter-light-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$LIGHT_ENV"
          python3 -m venv "$LIGHT_ENV"
          "$LIGHT_ENV/bin/python" -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --no-cache-dir --disable-pip-version-check 'numpy==2.3.5' 'Pillow==12.3.0'
          "$LIGHT_ENV/bin/python" tasks/lottery-shop/scripts/test_counter_light_prepare_ci.py --dependencies-only -v
          "$LIGHT_ENV/bin/python" tasks/lottery-shop/scripts/test_post_capture_safety_ci.py -v
          "$LIGHT_ENV/bin/python" tasks/lottery-shop/scripts/test_ambient_diagnostic_ci.py -v
      - name: Capture protected cold Stage-A inventory before project preparation
        id: inventorybefore
        timeout-minutes: 5
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/stage_a_inventory_ci.py before
      - name: Activate once in this attempt's private temporary container
        id: safestart
        timeout-minutes: 14
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/safe_project_ci.py start
      - name: Capture actual runtime with imported FBX, routed input, and visible HUD
        id: capture
        if: ${{ steps.safestart.outcome == 'success' }}
        timeout-minutes: 32
        run: |
          if [ "${{ steps.guard.outputs.execution_profile }}" = "ART_ONLY_DIAGNOSTIC" ]; then
            PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/safe_project_ci.py capture
          else
            PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/safe_project_ci.py capture --counter-light-diagnostic
          fi
      - name: Preserve fixed-schema bounded prebuild, lifecycle and runtime milestones
        if: ${{ always() && steps.guard.outcome == 'success' && steps.capture.outcome != 'skipped' }}
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py progress
      - name: Verify source-bound offline day and night reflection originals
        if: ${{ always() && steps.guard.outcome == 'success' && steps.capture.outcome != 'skipped' }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/reflection_bake_ci.py
      - name: Preserve bounded reflection preparation stages and fixed failure codes
        if: ${{ always() && steps.guard.outcome == 'success' && steps.capture.outcome != 'skipped' }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/reflection_progress_ci.py
      - name: Preserve fixed-schema startup observations without native logs
        if: ${{ always() && steps.guard.outcome == 'success' && steps.capture.outcome != 'skipped' }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/startup_progress_ci.py
      - name: Preserve fixed material initialization predicate receipt
        if: ${{ always() && steps.guard.outcome == 'success' && steps.capture.outcome != 'skipped' }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/material_initialization_ci.py
      - name: Preserve bounded capture NUnit XML, including real failures
        if: ${{ always() && steps.guard.outcome == 'success' && steps.capture.outcome != 'skipped' }}
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py tests --stage capture
      - name: Preserve verified originals already captured if later interaction failed
        if: ${{ always() && steps.guard.outcome == 'success' && steps.capture.outcome != 'skipped' }}
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py partial-captures
      - name: Require original eleven frames, six phone frames, and unchanged paired-state evidence
        if: ${{ always() && steps.guard.outcome == 'success' && steps.capture.outcome != 'skipped' }}
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py captures
      - name: Publish original candidate frames promptly for visual review
        if: ${{ always() && steps.guard.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lottery-visual-candidate-not-g3-pass-captures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tasks/lottery-shop/evidence/visual-candidate/source-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/source-before.json
            tasks/lottery-shop/evidence/visual-candidate/art-only-preparation.json
            tasks/lottery-shop/evidence/visual-candidate/font-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/reflections/Day.exr
            tasks/lottery-shop/evidence/visual-candidate/reflections/Day.exr.meta
            tasks/lottery-shop/evidence/visual-candidate/reflections/Night.exr
            tasks/lottery-shop/evidence/visual-candidate/reflections/Night.exr.meta
            tasks/lottery-shop/evidence/visual-candidate/reflections/reflection-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/reflection-progress.json
            tasks/lottery-shop/evidence/visual-candidate/reflection-export-diagnostic.json
            tasks/lottery-shop/evidence/visual-candidate/startup-progress.json
            tasks/lottery-shop/evidence/visual-candidate/material-initialization-progress.json
            tasks/lottery-shop/evidence/visual-candidate/safe-start.json
            tasks/lottery-shop/evidence/visual-candidate/safe-capture.json
            tasks/lottery-shop/evidence/visual-candidate/prebuild-progress.json
            tasks/lottery-shop/evidence/visual-candidate/runtime-progress.json
            tasks/lottery-shop/evidence/visual-candidate/lifecycle-progress.json
            tasks/lottery-shop/evidence/visual-candidate/preparation-scenes.json
            tasks/lottery-shop/evidence/visual-candidate/capture/raw-test-results.xml
            tasks/lottery-shop/evidence/visual-candidate/capture/raw-test-report-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/capture/test-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/captures/capture-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/captures/entry-whole-shop.png
            tasks/lottery-shop/evidence/visual-candidate/captures/table-empty.png
            tasks/lottery-shop/evidence/visual-candidate/captures/number-half.png
            tasks/lottery-shop/evidence/visual-candidate/captures/number-half-20x9.png
            tasks/lottery-shop/evidence/visual-candidate/captures/phone-room-standing.png
            tasks/lottery-shop/evidence/visual-candidate/captures/phone-table-before.png
            tasks/lottery-shop/evidence/visual-candidate/captures/phone-contacts.png
            tasks/lottery-shop/evidence/visual-candidate/captures/phone-mom-pending.png
            tasks/lottery-shop/evidence/visual-candidate/captures/phone-mom-claimed.png
            tasks/lottery-shop/evidence/visual-candidate/captures/phone-table-return.png
            tasks/lottery-shop/evidence/visual-candidate/captures/challenge-two-safe-three-tools.png
            tasks/lottery-shop/evidence/visual-candidate/captures/shelf-before-open.png
            tasks/lottery-shop/evidence/visual-candidate/captures/shelf-after-open.png
            tasks/lottery-shop/evidence/visual-candidate/captures/challenge-returned-from-shelf.png
            tasks/lottery-shop/evidence/visual-candidate/captures/closing-day-table.png
            tasks/lottery-shop/evidence/visual-candidate/captures/exterior-day-far-front.png
            tasks/lottery-shop/evidence/visual-candidate/captures/exterior-day-near-window-left-oblique.png
            tasks/lottery-shop/evidence/visual-candidate/captures/exterior-day-near-door-right-oblique.png
            tasks/lottery-shop/evidence/visual-candidate/captures/night-table.png
            tasks/lottery-shop/evidence/visual-candidate/captures/exterior-night-far-front.png
            tasks/lottery-shop/evidence/visual-candidate/captures/exterior-night-near-window-left-oblique.png
            tasks/lottery-shop/evidence/visual-candidate/captures/exterior-night-near-door-right-oblique.png
            tasks/lottery-shop/evidence/visual-candidate/captures/night-bill.png
          if-no-files-found: error
          retention-days: 7
      - name: Decide explicitly requested diagnostic prebuild-failure short-circuit
        id: regressiondecision
        if: ${{ always() && steps.guard.outcome == 'success' && steps.guard.outputs.execution_profile != 'ART_ONLY_DIAGNOSTIC' && steps.safestart.outcome == 'success' && steps.capture.outcome == 'failure' }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/diagnostic_early_stop_ci.py decide
      - name: Existing Probe, G2, and G3 EditMode suites without skipped cases
        id: regressionedit
        if: ${{ always() && steps.guard.outcome == 'success' && steps.guard.outputs.execution_profile != 'ART_ONLY_DIAGNOSTIC' && steps.safestart.outcome == 'success' && steps.capture.outcome != 'skipped' && !(steps.regressiondecision.outcome == 'success' && steps.regressiondecision.outputs.skip_regressions == 'true') }}
        timeout-minutes: 10
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/safe_project_ci.py regression-edit
      - name: Verify existing exact EditMode identities and preserve bounded original XML
        if: ${{ always() && steps.guard.outcome == 'success' && steps.regressionedit.outcome != 'skipped' }}
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py tests --stage regression-edit
      - name: Clear only fixed old G3 frame outputs before this attempt
        id: prepareoriginal
        if: ${{ always() && steps.guard.outcome == 'success' && steps.guard.outputs.execution_profile != 'ART_ONLY_DIAGNOSTIC' && steps.capture.outcome != 'skipped' && !(steps.regressiondecision.outcome == 'success' && steps.regressiondecision.outputs.skip_regressions == 'true') }}
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py prepare-original-g3-captures
      - name: Run exact 34 non-WORLD PlayMode cases in their own 720-second native process
        id: regressionplaycore
        if: ${{ always() && steps.guard.outcome == 'success' && steps.guard.outputs.execution_profile != 'ART_ONLY_DIAGNOSTIC' && steps.safestart.outcome == 'success' && steps.capture.outcome != 'skipped' && !(steps.regressiondecision.outcome == 'success' && steps.regressiondecision.outputs.skip_regressions == 'true') }}
        timeout-minutes: 14
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/safe_project_ci.py regression-play-core
      - name: Preserve core progress even on timeout
        if: ${{ always() && steps.guard.outcome == 'success' && steps.regressionplaycore.outcome != 'skipped' }}
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py regression-progress --shard core
      - name: Verify exact 34 core identities and preserve their native XML
        if: ${{ always() && steps.guard.outcome == 'success' && steps.regressionplaycore.outcome != 'skipped' }}
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py tests --stage regression-play-core
      - name: Preserve 14 originals from exact passed G3 case independently of sibling failures
        id: independentg3caseframes
        if: ${{ always() && steps.guard.outcome == 'success' && steps.prepareoriginal.outcome == 'success' && steps.regressionplaycore.outcome != 'skipped' }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/independent_g3_frames_ci.py
      - name: Upload independently verified G3 case originals without granting 23-frame or suite pass
        if: ${{ always() && steps.guard.outcome == 'success' && steps.independentg3caseframes.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lottery-independent-g3-case-14-frames-not-23-or-suite-pass-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tasks/lottery-shop/evidence/visual-candidate/source-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/original-g3-preparation.json
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/empty.png
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/number-half.png
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/number-revealed.png
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/number-copy.png
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/number-settled.png
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/configuration.png
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/phone.png
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/challenge-two-safe.png
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/challenge-selected.png
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/shop-shortcut.png
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/shop-physical.png
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/night.png
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/day-end.png
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/challenge-protected.png
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/render-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/independent-g3-case-captures/export-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/regression-play-core/raw-test-results.xml
            tasks/lottery-shop/evidence/visual-candidate/regression-play-core/test-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/safe-regression-play-core.json
          if-no-files-found: error
          retention-days: 7
      - name: Run exact 3 WORLD PlayMode cases in their own 480-second native process
        id: regressionplayworld
        if: ${{ always() && steps.guard.outcome == 'success' && steps.guard.outputs.execution_profile != 'ART_ONLY_DIAGNOSTIC' && steps.safestart.outcome == 'success' && steps.capture.outcome != 'skipped' && !(steps.regressiondecision.outcome == 'success' && steps.regressiondecision.outputs.skip_regressions == 'true') }}
        timeout-minutes: 10
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/safe_project_ci.py regression-play-world
      - name: Record NOT_RUN only after Edit and both Play processes were actually skipped
        if: ${{ always() && steps.guard.outcome == 'success' && steps.regressiondecision.outcome == 'success' && steps.regressiondecision.outputs.skip_regressions == 'true' && steps.regressionedit.outcome == 'skipped' && steps.regressionplaycore.outcome == 'skipped' && steps.regressionplayworld.outcome == 'skipped' }}
        env:
          DECISION_OUTCOME: ${{ steps.regressiondecision.outcome }}
          DECISION_SKIP: ${{ steps.regressiondecision.outputs.skip_regressions }}
          REGRESSION_EDIT_OUTCOME: ${{ steps.regressionedit.outcome }}
          REGRESSION_PLAY_CORE_OUTCOME: ${{ steps.regressionplaycore.outcome }}
          REGRESSION_PLAY_WORLD_OUTCOME: ${{ steps.regressionplayworld.outcome }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/diagnostic_early_stop_ci.py finalize
      - name: Preserve WORLD progress even on timeout
        if: ${{ always() && steps.guard.outcome == 'success' && steps.regressionplayworld.outcome != 'skipped' }}
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py regression-progress --shard world
      - name: Preserve bounded WORLD route and ray sidecar even on timeout
        if: ${{ always() && steps.guard.outcome == 'success' && steps.regressionplayworld.outcome != 'skipped' }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/world_progress_ci.py
      - name: Verify exact 3 WORLD identities and preserve their native XML
        if: ${{ always() && steps.guard.outcome == 'success' && steps.regressionplayworld.outcome != 'skipped' }}
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py tests --stage regression-play-world
      - name: Require disjoint exact 37 identities and both native exits without merging XML
        if: ${{ always() && steps.guard.outcome == 'success' && (steps.regressionplaycore.outcome != 'skipped' || steps.regressionplayworld.outcome != 'skipped') }}
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py play-summary
      - name: Preserve separate existing 14-frame originals only after exact native PlayMode passes
        id: originalcaptures
        if: ${{ always() && steps.guard.outcome == 'success' && steps.prepareoriginal.outcome == 'success' && steps.regressionplaycore.outcome != 'skipped' }}
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py original-g3-captures
      - name: Upload separately verified existing 14 original G3 frames
        if: ${{ always() && steps.guard.outcome == 'success' && steps.originalcaptures.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lottery-visual-candidate-not-g3-pass-existing-g3-frames-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tasks/lottery-shop/evidence/visual-candidate/source-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/original-g3-preparation.json
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/render-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/export-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/regression-play-core/raw-test-results.xml
            tasks/lottery-shop/evidence/visual-candidate/regression-play-core/test-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/safe-regression-play-core.json
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/empty.png
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/number-half.png
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/number-revealed.png
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/number-copy.png
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/number-settled.png
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/configuration.png
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/phone.png
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/challenge-two-safe.png
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/challenge-selected.png
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/shop-shortcut.png
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/shop-physical.png
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/night.png
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/day-end.png
            tasks/lottery-shop/evidence/visual-candidate/original-g3-captures/challenge-protected.png
          if-no-files-found: error
          retention-days: 7
      - name: Return only this temporary session and verify its container is gone
        id: nativefinish
        if: ${{ always() && steps.guard.outcome == 'success' && steps.safestart.outcome != 'skipped' }}
        timeout-minutes: 5
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/safe_project_ci.py finish
      - name: Project only the fixed interior model meta structure after cleanup
        id: interiormetaprojection
        if: ${{ always() && steps.guard.outcome == 'success' && steps.nativefinish.outcome == 'success' && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        timeout-minutes: 1
        env:
          META_GUARD_OUTCOME: ${{ steps.guard.outcome }}
          META_FINISH_OUTCOME: ${{ steps.nativefinish.outcome }}
          META_CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/export_interior_meta.py
          echo 'safe_projection=true' >> "$GITHUB_OUTPUT"
      - name: Preserve only the bounded fixed model-meta structure projection
        if: ${{ always() && steps.interiormetaprojection.outcome == 'success' && steps.interiormetaprojection.outputs.safe_projection == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lottery-interior-meta-structure-not-source-waiver-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lottery-interior-meta-structure-${{ github.run_id }}-${{ github.run_attempt }}/interior-meta-structure.json
          if-no-files-found: error
          retention-days: 7
      - name: Record art-only NOT_RUN from actual skipped regressions without replacing failures
        id: artreceipt
        if: ${{ always() && steps.guard.outcome == 'success' && steps.guard.outputs.execution_profile == 'ART_ONLY_DIAGNOSTIC' }}
        env:
          ART_GUARD_OUTCOME: ${{ steps.guard.outcome }}
          ART_EXECUTION_PROFILE: ${{ steps.guard.outputs.execution_profile }}
          ART_PREPARE_OUTCOME: ${{ steps.artprepare.outcome }}
          ART_START_OUTCOME: ${{ steps.safestart.outcome }}
          ART_CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          ART_FINISH_OUTCOME: ${{ steps.nativefinish.outcome }}
          ART_PREPARE_ORIGINAL_OUTCOME: ${{ steps.prepareoriginal.outcome }}
          REGRESSION_EDIT_OUTCOME: ${{ steps.regressionedit.outcome }}
          REGRESSION_PLAY_CORE_OUTCOME: ${{ steps.regressionplaycore.outcome }}
          REGRESSION_PLAY_WORLD_OUTCOME: ${{ steps.regressionplayworld.outcome }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/art_only_capture_ci.py finalize
      - name: Publish the explicit art-only profile receipt with no regression or G3 claim
        if: ${{ always() && steps.artreceipt.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lottery-art-only-diagnostic-regressions-not-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/lottery-shop/evidence/visual-candidate/art-only-execution.json
          if-no-files-found: error
          retention-days: 7
      - name: Capture source mutation metadata without exporting project settings or logs
        if: ${{ always() && steps.guard.outcome == 'success' && steps.capture.outcome != 'skipped' }}
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py snapshot-after
      - name: Upload bounded regression and source mutation evidence
        if: ${{ always() && steps.guard.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lottery-visual-candidate-not-g3-pass-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tasks/lottery-shop/evidence/visual-candidate/source-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/source-after.json
            tasks/lottery-shop/evidence/visual-candidate/source-changes.json
            tasks/lottery-shop/evidence/visual-candidate/safe-start.json
            tasks/lottery-shop/evidence/visual-candidate/safe-capture.json
            tasks/lottery-shop/evidence/visual-candidate/safe-regression-edit.json
            tasks/lottery-shop/evidence/visual-candidate/safe-regression-play-core.json
            tasks/lottery-shop/evidence/visual-candidate/safe-regression-play-world.json
            tasks/lottery-shop/evidence/visual-candidate/regression-play-core-progress.json
            tasks/lottery-shop/evidence/visual-candidate/regression-play-world-progress.json
            tasks/lottery-shop/evidence/visual-candidate/world-progress.json
            tasks/lottery-shop/evidence/visual-candidate/regression-play-summary.json
            tasks/lottery-shop/evidence/visual-candidate/safe-finish.json
            tasks/lottery-shop/evidence/visual-candidate/safe-session.json
            tasks/lottery-shop/evidence/visual-candidate/diagnostic-regression-decision.json
            tasks/lottery-shop/evidence/visual-candidate/diagnostic-regression-not-run.json
            tasks/lottery-shop/evidence/visual-candidate/art-only-execution.json
            tasks/lottery-shop/evidence/visual-candidate/art-only-preparation.json
            tasks/lottery-shop/evidence/visual-candidate/regression-edit/raw-test-results.xml
            tasks/lottery-shop/evidence/visual-candidate/regression-edit/raw-test-report-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/regression-edit/test-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/regression-play-core/raw-test-results.xml
            tasks/lottery-shop/evidence/visual-candidate/regression-play-world/raw-test-results.xml
            tasks/lottery-shop/evidence/visual-candidate/regression-play-core/raw-test-report-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/regression-play-world/raw-test-report-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/regression-play-core/test-receipt.json
            tasks/lottery-shop/evidence/visual-candidate/regression-play-world/test-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Collect screened counter-light originals independently of semantic acceptance
        id: counterlightobservation
        if: ${{ always() && steps.guard.outcome == 'success' && steps.counterlightdeps.outcome == 'success' && steps.capture.outcome != 'skipped' }}
        timeout-minutes: 5
        run: PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/lottery-counter-light-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/bin/python" tasks/lottery-shop/scripts/counter_light_diagnostics/export_observation.py
      - name: Upload safe partial observations with no native or art acceptance claim
        if: ${{ always() && steps.counterlightobservation.outputs.safe_observation == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lottery-counter-light-unvalidated-observations-not-g3-pass-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/lottery-shop/artifacts/counter-light-observation
          if-no-files-found: error
          retention-days: 7
      - name: Revalidate native and normal evidence before packaging counter-light diagnostic
        id: counterlightfinalize
        if: ${{ always() && steps.guard.outcome == 'success' && steps.counterlightprepare.outcome == 'success' && steps.counterlightdeps.outcome == 'success' && steps.capture.outcome == 'success' && steps.regressionedit.outcome == 'success' && steps.regressionplaycore.outcome == 'success' && steps.regressionplayworld.outcome == 'success' }}
        timeout-minutes: 5
        run: PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/lottery-counter-light-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/bin/python" tasks/lottery-shop/scripts/counter_light_diagnostics/compose_evidence.py finalize --repo-root "$GITHUB_WORKSPACE" --diagnostic "$GITHUB_WORKSPACE/tasks/lottery-shop/artifacts/counter-light-diagnostic/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT" --output "$GITHUB_WORKSPACE/tasks/lottery-shop/artifacts/counter-light-package"
      - name: Upload only the strictly composed counter-light diagnostic evidence bundle
        if: ${{ always() && steps.counterlightfinalize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lottery-counter-light-diagnostic-not-art-approval-not-g3-pass-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/lottery-shop/artifacts/counter-light-package
          if-no-files-found: error
          retention-days: 7
      - name: Observe bounded inventory only after the existing native cleanup
        id: inventoryafter
        if: ${{ always() && steps.guard.outcome == 'success' && steps.inventorybefore.outcome == 'success' && steps.capture.outcome != 'skipped' }}
        timeout-minutes: 5
        run: PYTHONDONTWRITEBYTECODE=1 python3 "$RUNNER_TEMP/lottery-shop-inventory-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/code/stage_a_inventory_ci.py" after
      - name: Validate source-bound safe JSON without granting source waiver or G3 pass
        id: inventorypublish
        if: ${{ always() && steps.guard.outcome == 'success' && steps.inventoryafter.outcome == 'success' }}
        timeout-minutes: 5
        run: PYTHONDONTWRITEBYTECODE=1 python3 "$RUNNER_TEMP/lottery-shop-inventory-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/code/stage_a_inventory_ci.py" publish
      - name: Upload exactly one validated Stage-A observation JSON
        if: ${{ always() && steps.guard.outcome == 'success' && steps.inventorypublish.outcome == 'success' && steps.inventorypublish.outputs.publishable == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lottery-shop-inventory-not-source-waiver-not-g3-pass-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/lottery-shop/evidence/visual-candidate/shop-inventory-not-source-waiver-not-g3-pass.json
          if-no-files-found: error
          retention-days: 7
      - name: Independently screen post-step statuses into fresh bounded staging
        id: poststatuscollect
        if: ${{ always() && steps.guard.outcome == 'success' }}
        timeout-minutes: 1
        run: PYTHONDONTWRITEBYTECODE=1 python3 tasks/lottery-shop/scripts/post_capture_safety.py collect-statuses
      - name: Preserve only freshly screened fixed post-step statuses
        if: ${{ always() && steps.poststatuscollect.outcome == 'success' && steps.poststatuscollect.outputs.safe_statuses == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lottery-post-step-fixed-status-not-g3-pass-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/lottery-shop/artifacts/post-capture-screened-status
          if-no-files-found: error
          retention-days: 7
      - name: Preserve explicit inventory failure after all original evidence and cleanup
        if: ${{ always() && steps.guard.outcome == 'success' && (steps.inventorybefore.outcome != 'success' || steps.inventoryafter.outcome != 'success' || steps.inventorypublish.outcome != 'success') }}
        run: |
          echo 'STAGE_A_INVENTORY_BLOCKED_NOT_SOURCE_WAIVER_NOT_G3_PASS'
          exit 1

  android-diagnostic-candidate:
    name: Cold installable Android candidate, no device or G3 acceptance
    needs: visual-candidate
    if: >-
      always() && !cancelled() && needs.visual-candidate.outputs.android_requested == 'true' &&
      needs.visual-candidate.outputs.capture_outcome == 'success' && needs.visual-candidate.outputs.cleanup_outcome == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tasks/lottery-shop/
            /.github/workflows/lottery-visual-candidate.yml
      - name: Recheck exact request-only trigger and separately reviewed Android capability
        id: androidguard
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py guard
      - name: Prepare existing authorized disposable Android runner disk layout
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          python3 - <<'PYTHON'
          import shutil
          if shutil.disk_usage('.').free < 30*1024**3:
              raise SystemExit('Need at least 30 GiB for cold pinned Android image')
          PYTHON
      - name: Read the same pinned public activation and return commands
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: game-ci/unity-test-runner
          ref: 0ff419b913a3630032cbe0de48a0099b5a9f0ed9
          path: .visual-safe-upstream
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            dist/BlankProject
            dist/unity-config
            dist/platforms/ubuntu
      - name: Restore the existing source-bound licensed font in a cold checkout
        run: python3 tasks/lottery-shop/scripts/visual_candidate_ci.py restore-font
      - name: Build and verify isolated diagnostic APK with bounded private native output
        id: androidbuild
        timeout-minutes: 65
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: python3 tasks/lottery-shop/scripts/android_candidate_ci.py run
      - name: Independently verify this exact Android container is absent
        id: androidcleanup
        if: ${{ always() && steps.androidguard.outcome == 'success' && steps.androidbuild.outcome != 'skipped' }}
        timeout-minutes: 2
        run: python3 tasks/lottery-shop/scripts/android_candidate_ci.py cleanup
      - name: Preserve bounded fixed diagnostic build status
        if: ${{ always() && steps.androidbuild.outputs.safe_receipt == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lottery-android-candidate-status-not-g3-pass-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/lottery-shop/artifacts/android-candidate-delivery/diagnostic-apk-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Deliver only verified isolated installable diagnostic APK
        if: ${{ steps.androidbuild.outcome == 'success' && steps.androidcleanup.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lottery-v39-android-diagnostic-not-device-tested-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tasks/lottery-shop/artifacts/android-candidate-delivery/LotteryCandidate.apk
            tasks/lottery-shop/artifacts/android-candidate-delivery/diagnostic-apk-receipt.json
          if-no-files-found: error
          retention-days: 7
