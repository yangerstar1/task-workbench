name: Merge research Love 085 ARM64 launch
on:
  push:
    branches: [codex/merge-research-android]
    paths: [.github/workflows/merge-research-android.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: merge-research-android-capability
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'yangerstar1/task-workbench' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify same-version ARM64 source and capture launch evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/merge-research-evidence"
          WORK="$RUNNER_TEMP/merge-research-probe"
          mkdir -p "$OUT" "$WORK"
          cleanup() {
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            if [[ -f "$WORK/kvm.acl" ]]; then sudo setfacl --restore="$WORK/kvm.acl" || true; fi
          }
          { uname -m; nproc; free -m; df -h /; ls -l /dev/kvm; } > "$OUT/runner.txt"
          test -c /dev/kvm
          getfacl -p /dev/kvm > "$WORK/kvm.acl"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK missing}}"
          export PATH="$SDK/platform-tools:$SDK/emulator:$SDK/cmdline-tools/latest/bin:$PATH"
          timeout 600 sdkmanager 'platform-tools' 'emulator' 'system-images;android-30;google_apis;x86_64' </dev/null > "$OUT/sdk-install.txt" 2>&1
          timeout 180 sudo apt-get update > "$OUT/apt-update.txt" 2>&1
          timeout 180 sudo apt-get install -y --no-install-recommends libpulse0 libnss3 libasound2t64 libgl1 libegl1 libx11-6 libxcb1 libxkbcommon0 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxtst6 python3-pil > "$OUT/apt-install.txt" 2>&1
          ldd "$SDK/emulator/qemu/linux-x86_64/qemu-system-x86_64" > "$OUT/native-libraries.txt"
          emulator -version > "$OUT/emulator-version.txt" 2>&1
          emulator -accel-check > "$OUT/acceleration.txt" 2>&1
          cp "$SDK/system-images/android-30/google_apis/x86_64/source.properties" "$OUT/image-source.properties"
          export ANDROID_AVD_HOME="$WORK/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd -n merge_probe -k 'system-images;android-30;google_apis;x86_64' --force > "$OUT/avd-create.txt" 2>&1
          nohup emulator -avd merge_probe -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 -cores 2 -camera-back none -camera-front none > "$OUT/emulator.log" 2>&1 &
          EMUPID=$!
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          timeout 180 adb -s emulator-5554 wait-for-device
          READY=false
          for ((i=0;i<90;i++)); do
            if [[ $(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r') == 1 ]]; then READY=true; break; fi
            kill -0 "$EMUPID"
            sleep 2
          done
          test "$READY" == true
          adb -s emulator-5554 shell wm size 720x1280
          adb -s emulator-5554 shell wm density 240
          { adb -s emulator-5554 shell getprop ro.product.cpu.abilist; adb -s emulator-5554 shell getprop ro.dalvik.vm.native.bridge; adb -s emulator-5554 shell getprop ro.build.version.sdk; } > "$OUT/android-abi.txt"
          # Public, same-version architecture experiment only. No account or consent input.
          curl --fail --location --silent --show-error --max-time 150 --max-filesize 300000000 'https://d.apkpure.net/b/XAPK/com.Trailmix.LoveAndPiesMerge?versionCode=7850&nc=armeabi-v7a&sv=24' -o "$WORK/love32.xapk"
          curl --fail --location --silent --show-error --max-time 150 --max-filesize 300000000 'https://d.apkpure.net/b/XAPK/com.Trailmix.LoveAndPiesMerge?versionCode=7850&nc=arm64-v8a&sv=24' -o "$WORK/love64.xapk"
          export WORK OUT
          AAPT=$(find "$SDK/build-tools" -name aapt -type f | sort -V | tail -n1)
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -n1)
          test -x "$AAPT" && test -x "$APKSIGNER"
          export AAPT APKSIGNER
          python3 - <<'PY'
          import os,pathlib,zipfile,json,hashlib,subprocess,re
          root=pathlib.Path(os.environ['WORK']);out=pathlib.Path(os.environ['OUT'])
          package='com.Trailmix.LoveAndPiesMerge'
          digest=lambda p:hashlib.file_digest(p.open('rb'),'sha256').hexdigest()
          receipt={'purpose':'Same 0.85.0 ARM64 launch experiment; not gameplay or quality acceptance','packages':{},'noAccountOrConsentInput':True}
          for arch,split in [('32','config.armeabi_v7a.apk'),('64','config.arm64_v8a.apk')]:
              src=root/('love'+arch+'.xapk');assert 1000000<src.stat().st_size<300000000
              dst=root/('apks'+arch);dst.mkdir()
              with zipfile.ZipFile(src) as z:
                  m=json.loads(z.read('manifest.json'))
                  assert m['package_name']==package and str(m['version_code'])=='7850' and m['version_name']=='0.85.0',m
                  apks=[e for e in z.infolist() if e.filename.endswith('.apk')]
                  assert {e.filename for e in apks}=={package+'.apk',split}
                  assert sum(e.file_size for e in apks)<300000000
                  for e in apks:(dst/e.filename).write_bytes(z.read(e))
              receipt['packages'][arch]={'bytes':src.stat().st_size,'sha256':digest(src),'manifest':m,'files':{p.name:{'bytes':p.stat().st_size,'sha256':digest(p)} for p in dst.iterdir()}}
          oldbase=root/'apks32'/(package+'.apk');newbase=root/'apks64'/(package+'.apk')
          assert digest(oldbase)=='aad54118f941be30304700710766cb1da5d6a4b60d1d4602053891ab7f64b1b1','Archived base identity mismatch'
          signers=[]
          for label,p in [('archived32-base',oldbase),('arm64-base',newbase),('arm64-split',root/'apks64/config.arm64_v8a.apk')]:
              r=subprocess.run([os.environ['APKSIGNER'],'verify','--verbose','--print-certs',str(p)],capture_output=True,text=True,timeout=30)
              (out/(label+'-signature.txt')).write_text(r.stdout+r.stderr)
              assert r.returncode==0,'APK signature verification failed'
              certs=re.findall(r'^Signer #\d+ certificate SHA-256 digest: (\S+)',r.stdout,re.M)
              assert len(certs)==1,'Expected one verified signer'
              signers.append(certs[0])
          assert len(set(signers))==1,'Signer differs from archived original'
          receipt['verifiedSignerSha256']=signers[0]
          expected={'assets/aa/Android/meta_popup_assets_all.bundle':'7a0e9593ad27c0d57b9e6b1c14feab3f14d22040802aeb737d1e5e84bc583229','assets/aa/Android/core_assets_all.bundle':'630c2c3c2ce4bd063a8fe8d13a7d98bb46ca7a7cd1c9182f1a816fb45eb35e09'}
          receipt['selectedOriginalAssetHashes']={}
          with zipfile.ZipFile(oldbase) as a,zipfile.ZipFile(newbase) as b:
              for name,want in expected.items():
                  hashes=[hashlib.sha256(z.read(name)).hexdigest() for z in [a,b]]
                  receipt['selectedOriginalAssetHashes'][name]={'archived32':hashes[0],'arm64':hashes[1],'expected':want,'equal':hashes==[want,want]}
              inventory={}
              for label,z in [('archived32',a),('arm64',b)]:
                  inventory[label]={i.filename:(i.file_size,i.CRC) for i in z.infolist() if i.filename.startswith('assets/aa/Android/') and i.filename.endswith('.bundle')}
              names=set(inventory['archived32'])|set(inventory['arm64'])
              changed=[n for n in sorted(names) if inventory['archived32'].get(n)!=inventory['arm64'].get(n)]
              receipt['bundleInventory']={'counts':{k:len(v) for k,v in inventory.items()},'differentSizeOrCrcCount':len(changed),'differentNamesFirst30':changed[:30]}
          (out/'package-identity.json').write_text(json.dumps(receipt,indent=2)+'\n')
          assert all(v['equal'] for v in receipt['selectedOriginalAssetHashes'].values()),'Selected source UI differs; stop before launch'
          badging=subprocess.run([os.environ['AAPT'],'dump','badging',str(newbase)],capture_output=True,text=True,check=True,timeout=20).stdout
          (out/'package-badging.txt').write_text(badging)
          assert "package: name='"+package+"'" in badging and "versionCode='7850'" in badging and "versionName='0.85.0'" in badging
          PY
          adb -s emulator-5554 install-multiple -r "$WORK"/apks64/*.apk > "$OUT/game-install.txt" 2>&1
          adb -s emulator-5554 shell cmd package resolve-activity --brief com.Trailmix.LoveAndPiesMerge | tr -d '\r' > "$OUT/game-activity.txt"
          ACTIVITY=$(tail -n1 "$OUT/game-activity.txt")
          [[ "$ACTIVITY" =~ ^com\.Trailmix\.LoveAndPiesMerge/[A-Za-z0-9._]+$ ]]
          export ACTIVITY
          python3 - <<'PY'
          import json,os,pathlib,subprocess,time
          out=pathlib.Path(os.environ['OUT']);adb=['adb','-s','emulator-5554']
          package='com.Trailmix.LoveAndPiesMerge'
          def run(args,timeout=20,check=True):
              return subprocess.run(adb+args,capture_output=True,timeout=timeout,check=check)
          run(['logcat','-c'])
          rec=subprocess.Popen(adb+['shell','screenrecord','--bit-rate','2000000','--time-limit','100','/sdcard/love64-launch.mp4'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          time.sleep(.5);start=time.monotonic()
          launch=run(['shell','am','start','-W','-n',os.environ['ACTIVITY']])
          (out/'game-launch.txt').write_bytes(launch.stdout+launch.stderr)
          checkpoints=[];last=0
          for target in [5,15,30,60,90]:
              time.sleep(max(0,target-(time.monotonic()-start)))
              elapsed=time.monotonic()-start
              p=run(['shell','pidof',package],check=False)
              screen=run(['exec-out','screencap','-p']).stdout
              assert screen.startswith(b'\x89PNG\r\n\x1a\n')
              (out/('game-'+str(target)+'s.png')).write_bytes(screen)
              foreground=run(['shell',"dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity'"],check=False).stdout.decode('utf8','replace')
              checkpoints.append({'targetSeconds':target,'actualSeconds':round(elapsed,3),'processPresent':p.returncode==0 and bool(p.stdout.strip()),'foreground':foreground.strip()})
              if not checkpoints[-1]['processPresent']:break
          pid=run(['shell','pidof','screenrecord'],check=False).stdout.decode().strip()
          if pid and all(c.isdigit() or c==' ' for c in pid):run(['shell','kill','-2',*pid.split()],check=False)
          try:rec.wait(timeout=15)
          except subprocess.TimeoutExpired:rec.terminate();rec.wait(timeout=5)
          pull=run(['pull','/sdcard/love64-launch.mp4',str(out/'love64-launch-original-speed-no-audio.mp4')],check=False)
          (out/'video-transfer.txt').write_bytes(pull.stdout+pull.stderr)
          crash=run(['logcat','-b','crash','-d','-v','threadtime'],check=False).stdout
          (out/'crash-buffer.txt').write_bytes(crash)
          logs=run(['logcat','-d','-v','brief'],check=False).stdout.decode('utf8','replace').splitlines()
          terms=('Built from','Initialize engine','GfxDevice','Renderer:','Fatal signal','SIGSEGV','FATAL EXCEPTION','Unable to load library','Unity version')
          safe=[line for line in logs if any(s in line for s in terms) and 'http' not in line.lower()]
          (out/'runtime-filtered.txt').write_text('\n'.join(safe[:160])+'\n')
          (out/'launch-observation.json').write_text(json.dumps({'checkpoints':checkpoints,'inputEvents':[],'noAccountOrConsentInput':True,'gameplayAccepted':False,'wholeGameAccepted':False,'requiresScreenshotReview':True},indent=2)+'\n')
          run(['emu','kill'],check=False)
          PY
      - name: Stop temporary Android and restore KVM permissions
        if: always()
        shell: bash
        run: |
          adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
          if [[ -f "$RUNNER_TEMP/merge-research-probe/kvm.acl" ]]; then sudo setfacl --restore="$RUNNER_TEMP/merge-research-probe/kvm.acl"; fi
      - name: Hash stable evidence after Android has stopped
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('merge-research-evidence')
          if root.is_dir():
              files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file() and p.name not in ['emulator.log','receipt.json']}
              (root/'receipt.json').write_text(json.dumps({'status':'CAPTURE_PROCEDURE_ONLY_REQUIRES_REVIEW','sha256':files,'wholeGameAccepted':False},indent=2)+'\n')
          PY
      - name: Preserve Love ARM64 launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: love-pies-arm64-${{ github.run_id }}
          path: |
            merge-research-evidence/
            !merge-research-evidence/emulator.log
          retention-days: 1
          if-no-files-found: warn
