name: Merge research observed merge verification
on:
  push:
    branches: [codex/merge-research-android]
    paths: [.github/workflows/merge-research-android.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: merge-research-android-capability
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'yangerstar1/task-workbench' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify Android acceleration and capture real input evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/merge-research-evidence"
          WORK="$RUNNER_TEMP/merge-research-probe"
          mkdir -p "$OUT" "$WORK"
          cleanup() {
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            if [[ -f "$WORK/kvm.acl" ]]; then sudo setfacl --restore="$WORK/kvm.acl" || true; fi
          }
          { uname -m; nproc; free -m; df -h /; ls -l /dev/kvm; } > "$OUT/runner.txt"
          test -c /dev/kvm
          getfacl -p /dev/kvm > "$WORK/kvm.acl"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK missing}}"
          export PATH="$SDK/platform-tools:$SDK/emulator:$SDK/cmdline-tools/latest/bin:$PATH"
          timeout 600 sdkmanager 'platform-tools' 'emulator' 'system-images;android-30;google_apis;x86_64' </dev/null > "$OUT/sdk-install.txt" 2>&1
          timeout 180 sudo apt-get update > "$OUT/apt-update.txt" 2>&1
          timeout 180 sudo apt-get install -y --no-install-recommends libpulse0 libnss3 libasound2t64 libgl1 libegl1 libx11-6 libxcb1 libxkbcommon0 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxtst6 python3-pil > "$OUT/apt-install.txt" 2>&1
          ldd "$SDK/emulator/qemu/linux-x86_64/qemu-system-x86_64" > "$OUT/native-libraries.txt"
          emulator -version > "$OUT/emulator-version.txt" 2>&1
          emulator -accel-check > "$OUT/acceleration.txt" 2>&1
          cp "$SDK/system-images/android-30/google_apis/x86_64/source.properties" "$OUT/image-source.properties"
          export ANDROID_AVD_HOME="$WORK/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd -n merge_probe -k 'system-images;android-30;google_apis;x86_64' --force > "$OUT/avd-create.txt" 2>&1
          nohup emulator -avd merge_probe -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 -cores 2 -camera-back none -camera-front none > "$OUT/emulator.log" 2>&1 &
          EMUPID=$!
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          timeout 180 adb -s emulator-5554 wait-for-device
          READY=false
          for ((i=0;i<90;i++)); do
            if [[ $(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r') == 1 ]]; then READY=true; break; fi
            kill -0 "$EMUPID"
            sleep 2
          done
          test "$READY" == true
          adb -s emulator-5554 shell wm size 720x1280
          adb -s emulator-5554 shell wm density 240
          { adb -s emulator-5554 shell getprop ro.product.cpu.abilist; adb -s emulator-5554 shell getprop ro.dalvik.vm.native.bridge; adb -s emulator-5554 shell getprop ro.build.version.sdk; } > "$OUT/android-abi.txt"
          # A public third-party package stays only in this disposable runner.
          # Upload screenshots/logs only, never the package, credentials or a user save.
          curl --fail --location --silent --show-error --max-time 240 'https://d.apkpure.net/b/XAPK/io.randomco.travel?version=latest' -o "$WORK/travel-town.xapk"
          export WORK
          python3 - <<'PY'
          import os,pathlib,zipfile,json,hashlib
          root=pathlib.Path(os.environ['WORK']); out=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'merge-research-evidence'
          src=root/'travel-town.xapk'; assert 1000000<src.stat().st_size<500000000
          dst=root/'apks';dst.mkdir()
          with zipfile.ZipFile(src) as z:
              manifest=json.loads(z.read('manifest.json'))
              assert manifest['package_name']=='io.randomco.travel'
              entries=[i for i in z.infolist() if i.filename.endswith('.apk')]
              assert 1<=len(entries)<=16
              assert sum(i.file_size for i in entries)<800000000
              names=set()
              for e in entries:
                  name=pathlib.PurePosixPath(e.filename).name
                  assert name not in names
                  names.add(name)
                  (dst/name).write_bytes(z.read(e))
          (out/'package-identity.json').write_text(json.dumps({'source':'public APKPure download; compare SHA256 with the archived Drive package','bytes':src.stat().st_size,'sha256':hashlib.file_digest(src.open('rb'),'sha256').hexdigest(),'manifest':manifest},indent=2)+'\n')
          PY
          AAPT=$(find "$SDK/build-tools" -name aapt -type f | sort -V | tail -n1)
          for APK in "$WORK"/apks/*.apk; do "$AAPT" dump badging "$APK"; done > "$OUT/package-badging.txt"
          adb -s emulator-5554 install-multiple -r "$WORK"/apks/*.apk > "$OUT/game-install.txt" 2>&1
          adb -s emulator-5554 shell cmd package resolve-activity --brief io.randomco.travel | tr -d '\r' > "$OUT/game-activity.txt"
          ACTIVITY=$(tail -n1 "$OUT/game-activity.txt")
          [[ "$ACTIVITY" =~ ^io\.randomco\.travel/[A-Za-z0-9._]+$ ]]
          adb -s emulator-5554 logcat -c
          adb -s emulator-5554 shell am start -W -n "$ACTIVITY" > "$OUT/game-launch.txt"
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,time,xml.etree.ElementTree as ET
          from PIL import Image
          out=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'merge-research-evidence'
          adb=['adb','-s','emulator-5554']
          refs={'terms': {'box': [80, 400, 560, 810], 'bits': '001101100001001101011010110010010101101001100001010011010001000101101001010100010110010100001001011101100100000101100100011001010101110101100101'}, 'tutorial': {'box': [70, 864, 481, 987], 'bits': '000000000000000100000100000000101101110001010010101101001001010010110001001000011000100100101000101011010101000000100000010000000000000000000001'}}
          def run(args,timeout=20,check=True):
              return subprocess.run(adb+args,capture_output=True,timeout=timeout,check=check)
          def capture(name):
              b=run(['exec-out','screencap','-p']).stdout
              (out/name).write_bytes(b);return Image.open(io.BytesIO(b))
          def match(im,kind):
              if im.size!=(640,1280):return False
              ref=refs[kind];v=list(im.crop(ref['box']).convert('L').resize((17,9)).getdata())
              bits=''.join('1' if v[y*17+x]>v[y*17+x+1] else '0' for y in range(9) for x in range(16))
              return sum(a!=b for a,b in zip(bits,ref['bits']))<=6
          events=[];terms_done=False;board_seen=False
          for attempt in range(48):
              im=capture('latest.png')
              if not terms_done and match(im,'terms'):
                  (out/'terms-before-confirm.png').write_bytes((out/'latest.png').read_bytes())
                  run(['shell','input','tap','320','900'])
                  terms_done=True;events.append({'action':'accept user-approved terms','elapsedSecondsApprox':attempt*5})
              elif match(im,'tutorial'):
                  board_seen=True;break
              time.sleep(5)
          (out/'before-merge.png').write_bytes((out/'latest.png').read_bytes())
          if board_seen:
              rec=subprocess.Popen(adb+['shell','screenrecord','--time-limit','25','/sdcard/actual-merge.mp4'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              time.sleep(1)
              run(['shell','input','swipe','229','737','320','737','650'])
              events.append({'action':'drag observed left dirty bucket onto right dirty bucket','from':[229,737],'to':[320,737],'durationMs':650})
              time.sleep(2);capture('after-merge-2s.png')
              time.sleep(6);capture('after-merge-8s.png')
              rec.wait(timeout=35)
              run(['pull','/sdcard/actual-merge.mp4',str(out/'actual-merge-original-speed-no-audio.mp4')])
          (out/'input-events.json').write_text(json.dumps({'termsAccepted':terms_done,'tutorialImageMatched':board_seen,'events':events,'qualityAcceptance':False},indent=2))
          (out/'foreground.txt').write_bytes(run(['shell','dumpsys','activity','activities']).stdout)
          (out/'display-size.txt').write_bytes(run(['shell','wm','size']).stdout)
          (out/'package-flags.txt').write_bytes(run(['shell',"dumpsys package io.randomco.travel | grep -E 'flags=|privateFlags=|versionName=|versionCode='"]).stdout)
          (out/'adb-root.txt').write_bytes(run(['root'],check=False).stdout)
          run(['wait-for-device'],timeout=25)
          for filename in ['io.randomco.travel.v2.playerprefs.xml','DEBUG_PREF.xml']:
              # Only preference names leave the disposable device; never output values.
              command='sed -n \'s/.*name="\\([^" ]*\\)".*/\\1/p\' /data/user/0/io.randomco.travel/shared_prefs/'+filename
              result=run(['shell',command],check=False)
              names=result.stdout.decode('utf-8','replace').splitlines()[:150]
              (out/(filename+'.names.json')).write_text(json.dumps(names,indent=2))
          run(['emu','kill'],check=False)
          files={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in out.iterdir() if f.is_file() and f.name not in ('emulator.log','receipt.json')}
          (out/'receipt.json').write_text(json.dumps({'status':'OBSERVED_MERGE_ATTEMPT_REQUIRES_SCREEN_REVIEW','sha256':files,'boardSeen':board_seen},indent=2))
          PY
      - name: Stop temporary Android and restore KVM permissions
        if: always()
        shell: bash
        run: |
          adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
          if [[ -f "$RUNNER_TEMP/merge-research-probe/kvm.acl" ]]; then sudo setfacl --restore="$RUNNER_TEMP/merge-research-probe/kvm.acl"; fi
      - name: Preserve merge input evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: travel-town-merge-${{ github.run_id }}
          path: |
            merge-research-evidence/
            !merge-research-evidence/emulator.log
          retention-days: 1
          if-no-files-found: warn
