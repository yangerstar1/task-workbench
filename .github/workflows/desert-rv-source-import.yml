name: Import audited Desert RV source
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: desert-rv-source-import
  cancel-in-progress: false
jobs:
  import:
    if: >-
      github.repository == 'yangerstar1/task-workbench' &&
      github.repository_owner == 'yangerstar1' &&
      github.actor == 'yangerstar1' &&
      github.triggering_actor == 'yangerstar1' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false &&
      github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact trusted dispatch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Test archive validation and preservation
        run: python3 -m unittest discover -s scripts -p test_import_desert_rv_source.py -v
      - name: Import fixed reviewed public source (no source execution)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/import_desert_rv_source.py
