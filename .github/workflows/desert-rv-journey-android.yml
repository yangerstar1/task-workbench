name: Desert RV restored Journey Android development candidate
on:
  push:
    branches: [journey-android-c15]
    paths: [.github/dispatch/desert-rv-journey-android-c15-restored-r5-20261011.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: desert-rv-journey-android
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'yangerstar1/task-workbench' &&
      github.event_name == 'push' && github.ref == 'refs/heads/journey-android-c15' &&
      github.actor == 'yangerstar1' && github.triggering_actor == 'yangerstar1'
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      JOURNEY_ANDROID_RESTORATION: desert-rv-journey-android-c15-restored-r5-20261011-once
      WORLD_CAPTURE_MODE: restored
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          fetch-depth: 2
      - name: Verify one-use Android candidate source identity
        id: dispatch_identity
        run: |
          /usr/bin/python3 tasks/desert-rv/scripts/player/journey_android.py dispatch
      - name: Verify current source before fixed Android-image readiness
        run: /usr/bin/python3 tasks/desert-rv/scripts/verify_evidence.py guard
      - name: Verify fixed Android-image readiness with at most one bounded fallback pull
        id: image_precheck
        run: |
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_image_precheck.py
          test ! -e tasks/desert-rv/journey-android-image-precheck.json
          test ! -L tasks/desert-rv/journey-android-image-precheck.json
          set -o noclobber
          exec 3> tasks/desert-rv/journey-android-image-precheck.json
          set +e
          /usr/bin/python3 tasks/desert-rv/scripts/environment_image_precheck.py --profile android >&3
          precheck_exit=$?
          set -e
          exec 3>&-
          echo 'report_written=true' >> "$GITHUB_OUTPUT"
          PRECHECK_EXIT="$precheck_exit" /usr/bin/python3 - <<'PYCODE'
          import json, os, pathlib, sys
          sys.path.insert(0, 'tasks/desert-rv/scripts')
          import environment_image_precheck as check
          check.select_profile('android')
          path=pathlib.Path('tasks/desert-rv/journey-android-image-precheck.json')
          assert path.is_file() and not path.is_symlink() and 0 < path.stat().st_size <= 8192
          value=json.loads(path.read_text(), object_pairs_hook=check.unique_object)
          assert check.validate_report(value)
          assert os.environ['PRECHECK_EXIT'] == ('0' if value['status']=='PASS' else '2')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output: output.write('report_valid=true\n')
          PYCODE
          exit "$precheck_exit"
      - name: Validate bounded image observation and actual step outcome
        id: image_report
        if: always() && steps.image_precheck.outputs.report_written == 'true' && steps.image_precheck.outputs.report_valid == 'true'
        env:
          PRECHECK_OUTCOME: ${{ steps.image_precheck.outcome }}
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import json, os, pathlib, sys
          sys.path.insert(0, 'tasks/desert-rv/scripts')
          import environment_image_precheck as check
          check.select_profile('android')
          path=pathlib.Path('tasks/desert-rv/journey-android-image-precheck.json')
          assert path.is_file() and not path.is_symlink() and 0 < path.stat().st_size <= 8192
          value=json.loads(path.read_text(), object_pairs_hook=check.unique_object)
          assert check.validate_report(value)
          assert os.environ['PRECHECK_OUTCOME'] == ('success' if value['status']=='PASS' else 'failure')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output: output.write('export_ready=true\n')
          PYCODE
      - name: Upload only validated fixed Android image availability observation
        if: always() && steps.image_precheck.outputs.report_written == 'true' && steps.image_report.outputs.export_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journey-android-image-precheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/desert-rv/journey-android-image-precheck.json
          if-no-files-found: error
          retention-days: 7
      - name: Prepare official validators and source before snapshot
        run: |
          python3 tasks/desert-rv/scripts/verify_evidence.py guard
          sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil python3-yaml
          python3 tasks/desert-rv/scripts/backup/restore_unity_font.py
      - name: Validate recovery host gates and restore exact original producer bytes
        id: restore_assets
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSITION_SHA: ${{ steps.dispatch_identity.outputs.transition_sha256 }}
        run: |
          env -u JOURNEY_ANDROID_RESTORATION /usr/bin/python3 tasks/desert-rv/scripts/player/test_journey_android.py
          env -u JOURNEY_ANDROID_RESTORATION /usr/bin/python3 tasks/desert-rv/art/journey-preparation/test_restore_preparation.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_journey_mobile_hud_native.py
          /usr/bin/python3 tasks/desert-rv/scripts/player/test_verify_tracer_shader.py
          /usr/bin/python3 tasks/desert-rv/art/journey-preparation/restore_preparation.py stage --policy-sha256 "$TRANSITION_SHA"
      - name: Prepare existing licensed runner after input validation
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          bash tasks/desert-rv/scripts/prepare_runner.sh
          docker build --file tasks/desert-rv/scripts/player/JourneyAndroid.Dockerfile --tag desert-rv-journey-android:local tasks/desert-rv/scripts/player
      - name: Native current consumer exact seventeen boundary cases
        id: linux_boundary
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.19f1
          customImage: desert-rv-journey-android:local
          projectPath: tasks/desert-rv/unity
          testMode: editmode
          artifactsPath: tasks/desert-rv/artifacts/journey-linux-boundary
          customParameters: -assemblyNames DesertRV.CandidateLinuxTests -buildTarget Android -force-glcore -job-worker-count 2
          dockerCpuLimit: 2
          dockerMemoryLimit: 12g
      - name: Require current consumer boundary evidence and immutable restored input
        run: python3 tasks/desert-rv/art/journey-preparation/restore_preparation.py verify-boundary
      - name: Native parent verification one material derivation and two world HUD captures
        id: restore_native
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.19f1
          customImage: desert-rv-journey-android:local
          projectPath: tasks/desert-rv/unity
          testMode: editmode
          artifactsPath: tasks/desert-rv/artifacts/journey-restoration
          customParameters: -assemblyNames DesertRV.JourneyRestorationTests -journeyRestorationDiagnosticSchema 2 -journeyRestorationRunId ${{ github.run_id }} -buildTarget Android -force-glcore -job-worker-count 2
          dockerCpuLimit: 2
          dockerMemoryLimit: 12g
      - name: Verify current derived restoration1 and exact one material change after Editor exit
        id: restore_finish
        if: always() && steps.restore_native.outcome != 'skipped'
        env:
          NATIVE: ${{ steps.restore_native.outcome }}
        run: python3 tasks/desert-rv/art/journey-preparation/restore_preparation.py finish --native "$NATIVE"
      - name: Verify and preserve exact two authored world plus HUD fixture captures
        id: mobile_hud_world
        if: always() && steps.restore_native.outcome != 'skipped'
        env:
          NATIVE_OUTCOME: ${{ steps.restore_native.outcome }}
        run: python3 tasks/desert-rv/scripts/journey_mobile_hud_native.py world
      - name: Upload only verified authored R1 and R3 world camera HUD fixtures
        if: always() && steps.mobile_hud_world.outcome == 'success' && steps.mobile_hud_world.outputs.export_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journey-mobile-hud-world-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/desert-rv/mobile-hud-world-export
          if-no-files-found: error
          retention-days: 7
      - name: Upload only current bounded world HUD host diagnostics
        if: always() && steps.mobile_hud_world.outputs.world_diagnostic_written == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journey-mobile-hud-world-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/desert-rv/mobile-hud-world-diagnostic/world-diagnostic.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve fixed failed world captures as diagnostic only
        if: always() && steps.mobile_hud_world.outputs.world_failure_captures_written == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journey-mobile-hud-world-DIAGNOSTIC-ONLY-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/desert-rv/mobile-hud-world-failure-export/
          if-no-files-found: error
          retention-days: 7
      - name: Upload only post-exit verified one material derived preparation
        if: always() && steps.restore_finish.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journey-derived-preparation-UNREVIEWED-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/desert-rv/journey-derived-preparation-export/
          if-no-files-found: error
          retention-days: 7
      - name: Prepare derived Android input with separate original producer and current native evidence
        id: android_input
        if: success() && steps.restore_finish.outcome == 'success' && steps.mobile_hud_world.outcome == 'success' && steps.mobile_hud_world.outputs.world_verified == 'true'
        run: python3 tasks/desert-rv/scripts/player/journey_android.py prepare
      - name: Read pinned official activation and return scripts
        if: success() && steps.android_input.outcome == 'success'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: game-ci/unity-test-runner
          ref: 0ff419b913a3630032cbe0de48a0099b5a9f0ed9
          path: _ci/gameci-journey-android
          persist-credentials: false
          lfs: false
      - name: Verify exact Android build inputs and fresh output paths
        if: success() && steps.android_input.outcome == 'success'
        run: python3 tasks/desert-rv/scripts/player/journey_android.py before
      - name: Build Android IL2CPP ARM64 development APK without launching it
        id: android_native
        if: success() && steps.android_input.outcome == 'success'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set +x
          docker run --rm --init --cpus=2 --memory=12g --stop-timeout=210 \
            --workdir /github/workspace \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --volume "$GITHUB_WORKSPACE/_ci/gameci-journey-android/dist:/gameci:ro" \
            --env UNITY_LICENSE --env UNITY_EMAIL --env UNITY_PASSWORD \
            --env GITHUB_ACTIONS --env GITHUB_SHA --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env GITHUB_REPOSITORY --env GITHUB_REF --env GITHUB_ACTOR --env GITHUB_TRIGGERING_ACTOR \
            --env JOURNEY_ANDROID_RESTORATION --env WORLD_CAPTURE_MODE \
            --env GITHUB_EVENT_NAME --env GITHUB_WORKFLOW_REF --env GITHUB_EVENT_PATH=/github/workflow/event.json \
            --volume "$GITHUB_EVENT_PATH:/github/workflow/event.json:ro" \
            --env RUNNER_ENVIRONMENT --env RUNNER_OS --env GITHUB_REPOSITORY_VISIBILITY \
            --entrypoint /bin/bash desert-rv-journey-android:local \
            /github/workspace/tasks/desert-rv/scripts/player/journey_android_container.sh
      - name: Reverify prepared source and package closure after Android build
        id: android_verify
        if: success() && steps.android_native.outcome == 'success'
        run: python3 tasks/desert-rv/scripts/player/journey_android.py verify
      - name: Export verified unreviewed APK or bounded failure status
        id: android_public
        if: always() && steps.android_native.outcome != 'skipped'
        env:
          NATIVE_OUTCOME: ${{ steps.android_native.outcome }}
          UNION_OUTCOME: ${{ steps.android_verify.outcome }}
        run: python3 tasks/desert-rv/scripts/player/journey_android.py export
      - name: Validate bounded Android control including first failure after cleanup or export
        id: android_control_report
        if: always() && steps.android_input.outcome != 'skipped'
        run: python3 tasks/desert-rv/scripts/player/journey_android.py control-report
      - name: Upload only validated Android control and fixed first-failure codes
        if: always() && steps.android_control_report.outputs.control_valid == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journey-android-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/desert-rv/journey-android-control.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload only Android candidate and sanitized proof
        if: always() && steps.android_public.outputs.export_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journey-android-CANDIDATE-NOT-DEVICE-TESTED-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/desert-rv/journey-android-public-export/
          if-no-files-found: error
          retention-days: 7
      - name: Prove tracked original source was not edited
        if: always()
        run: git diff --quiet --exit-code && git diff --cached --quiet --exit-code
      - name: Preserve bounded current restoration evidence
        id: restore_public
        if: always()
        run: python3 tasks/desert-rv/art/journey-preparation/restore_preparation.py diagnose
      - name: Upload only current restoration proof or fixed failure diagnostics
        if: always() && steps.restore_public.outputs.export_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journey-restoration-UNREVIEWED-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/desert-rv/journey-restoration-public-export/
          if-no-files-found: error
          retention-days: 7
