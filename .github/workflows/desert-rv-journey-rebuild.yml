name: Desert RV fixed official Linux template metadata probe
on:
  push:
    branches: [journey-linux-export-recovery-938]
    paths: [.github/dispatch/desert-rv-linux-template-probe-20261009.json]
permissions:
  contents: read
concurrency:
  group: desert-rv-journey-prepare
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'yangerstar1/task-workbench' &&
      github.event_name == 'push' && github.ref == 'refs/heads/journey-linux-export-recovery-938' &&
      github.actor == 'yangerstar1' && github.triggering_actor == 'yangerstar1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          fetch-depth: 2
      - name: Verify the single fixed branch metadata request and exact source
        run: |
          /usr/bin/python3 tasks/desert-rv/scripts/test_journey_rebuild_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/player/test_journey_linux_template_probe.py
          /usr/bin/python3 tasks/desert-rv/scripts/journey_rebuild_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/verify_evidence.py guard
      - name: Add only official Python tooling to the pinned Unity image
        run: |
          docker build --file tasks/desert-rv/scripts/player/TemplateProbe.Dockerfile --tag desert-rv-template-probe:local tasks/desert-rv/scripts/player
      - name: Probe official Linux module metadata without starting Unity
        id: module_probe
        run: |
          mkdir tasks/desert-rv/linux-template-probe-private
          timeout --signal=TERM --kill-after=10s 10m docker run --rm --init \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --cpus=2 --memory=2g --pids-limit=128 --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE/tasks/desert-rv/scripts/player/journey_linux_template_probe.py:/probe.py:ro" \
            --volume "$GITHUB_WORKSPACE/tasks/desert-rv/linux-template-probe-private:/probe-output:rw" \
            --env PROBE_SOURCE_COMMIT="$GITHUB_SHA" --env PROBE_RUN_ID="$GITHUB_RUN_ID" \
            --entrypoint /usr/bin/python3 desert-rv-template-probe:local /probe.py scan
      - name: Validate source and the bounded module metadata receipt
        id: probe_export
        if: always() && steps.module_probe.outcome != 'skipped'
        run: |
          git diff --quiet --exit-code && git diff --cached --quiet --exit-code
          /usr/bin/python3 tasks/desert-rv/scripts/player/journey_linux_template_probe.py export
          git diff --quiet --exit-code && git diff --cached --quiet --exit-code
      - name: Upload only official module metadata
        if: always() && steps.probe_export.outcome == 'success' && steps.probe_export.outputs.export_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journey-linux-template-METADATA-ONLY-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/desert-rv/linux-template-probe-public-export/
          if-no-files-found: error
          retention-days: 7
