name: Desert RV Environment emission lifecycle verification
run-name: Desert RV emission lifecycle verification, strict packaging unchanged · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/dispatch/desert-rv-environment-emission-lifecycle-20261009.json

permissions:
  contents: read

concurrency:
  group: desert-rv-environment-emission-lifecycle-evidence
  cancel-in-progress: false

jobs:
  environment:
    name: Observe generated bytes across twenty original Unity views and editor exit
    if: >-
      github.event_name == 'push' &&
      github.event.before == 'ac20a2758e3c9017aba00b5e64922ec51fe197e9' &&
      github.repository == 'yangerstar1/task-workbench' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'yangerstar1' &&
      github.triggering_actor == 'yangerstar1'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
          lfs: false
      - name: Verify this exact independent emission lifecycle fixed-push request
        run: |
          /usr/bin/python3 tasks/desert-rv/scripts/environment_emission_lifecycle_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/verify_evidence.py guard
      - name: Observe fixed image HEAD and conditionally pull once on this runner
        id: image_readiness
        run: |
          test ! -e tasks/desert-rv/image-readiness.json
          test ! -L tasks/desert-rv/image-readiness.json
          status=0
          /usr/bin/python3 tasks/desert-rv/scripts/environment_image_precheck.py > tasks/desert-rv/image-readiness.json || status=$?
          echo 'report_written=true' >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Validate the single sanitized readiness report before upload
        id: image_readiness_schema
        if: ${{ !cancelled() && steps.image_readiness.outputs.report_written == 'true' && (steps.image_readiness.outcome == 'success' || steps.image_readiness.outcome == 'failure') }}
        env:
          READINESS_OUTCOME: ${{ steps.image_readiness.outcome }}
        run: |
          /usr/bin/python3 - <<'PY'
          import json, os, stat, sys
          from pathlib import Path
          sys.path.insert(0, 'tasks/desert-rv/scripts')
          from environment_image_precheck import validate_report
          try:
              path = Path('tasks/desert-rv/image-readiness.json')
              if any(part.is_symlink() for part in (path, *path.parents)):
                  raise ValueError()
              info = path.stat()
              if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 8192:
                  raise ValueError()
              raw = path.read_bytes()
              if len(raw) != info.st_size or raw.count(b'\n') != 1 or not raw.endswith(b'\n'):
                  raise ValueError()
              def unique(pairs):
                  value = {}
                  for key, item in pairs:
                      if key in value:
                          raise ValueError()
                      value[key] = item
                  return value
              def reject_constant(_):
                  raise ValueError()
              report = json.loads(raw, object_pairs_hook=unique, parse_constant=reject_constant)
              if validate_report(report) is not True:
                  raise ValueError()
              outcome = os.environ.get('READINESS_OUTCOME')
              if outcome not in ('success', 'failure') or (report['status'] == 'PASS') != (outcome == 'success'):
                  raise ValueError()
          except Exception:
              print('IMAGE_READINESS_REPORT_REJECTED', file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Upload only the schema-validated readiness report
        if: ${{ !cancelled() && steps.image_readiness.outputs.report_written == 'true' && (steps.image_readiness.outcome == 'success' || steps.image_readiness.outcome == 'failure') && steps.image_readiness_schema.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desert-rv-environment-emission-lifecycle-IMAGE-READINESS-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/desert-rv/image-readiness.json
          if-no-files-found: error
          retention-days: 7
      - name: Install bounded image validator from official Ubuntu packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil python3-numpy
      - name: Validate guards and safety contracts
        run: |
          /usr/bin/python3 tasks/desert-rv/scripts/verify_evidence.py guard
          /usr/bin/python3 tasks/desert-rv/scripts/test_verify_evidence.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_evidence.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_evidence.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_runner_prefix.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_journey_rebuild_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_r2_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_r2_runner_prefix.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_armored_v004_discovery_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_r3_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_r3_runner_prefix.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_armored_v004_strict_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_terrain_probe_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_diffuse_comparison_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_diffuse_comparison_r1_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_terrain_probe_runner_prefix.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_diffuse_comparison_runner_prefix.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_diffuse_comparison_r1_runner_prefix.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_terrain_probe_evidence.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_diffuse_comparison_evidence.py
          /usr/bin/python3 tasks/desert-rv/art/environment-v4/diffuse-correction/test_correction.py
          /usr/bin/python3 tasks/desert-rv/art/environment-v4/test_candidate.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_r4_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_r4_runner_prefix.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_r4_evidence.py
          /usr/bin/python3 tasks/desert-rv/art/environment-v4/test_candidate_r4.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_r4_audit_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_r4_audit_runner_prefix.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_r4_audit.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_r4_audit_r1_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_r4_audit_r1_runner_prefix.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_r4_audit_r2_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_v4_r4_audit_r2_runner_prefix.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_image_precheck.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_emission_lifecycle_dispatch.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_emission_lifecycle_runner_prefix.py
          /usr/bin/python3 tasks/desert-rv/art/environment-v4/test_beacon_emission_lifecycle.py
          /usr/bin/python3 tasks/desert-rv/scripts/test_environment_emission_lifecycle_evidence.py
      - name: Restore exact checkpoint font
        run: |
          /usr/bin/python3 tasks/desert-rv/scripts/backup/restore_unity_font.py
          /usr/bin/python3 tasks/desert-rv/scripts/backup/restore_unity_font.py --verify-only
      - name: Snapshot protected source before native execution
        id: snapshot
        run: /usr/bin/python3 tasks/desert-rv/scripts/environment_v4_r4_evidence.py before
      - name: Prepare disposable standard runner
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash tasks/desert-rv/scripts/prepare_runner.sh
      - name: Prepare software OpenGL on pinned official GameCI editor
        run: >-
          docker build
          --build-arg BASE_IMAGE=unityci/editor@sha256:17406791cf1e438bea2dac20671668e05d83db5ed38c916744815db4584a8264
          --file tasks/desert-rv/scripts/Environment.Dockerfile
          --tag desert-rv-environment:local
          tasks/desert-rv/scripts
      - name: Execute separate native EditorRender author and capture entry
        id: native
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.19f1
          customImage: desert-rv-environment:local
          projectPath: tasks/desert-rv/unity
          testMode: editmode
          artifactsPath: tasks/desert-rv/artifacts/environment
          customParameters: -assemblyNames DesertRV.EditorRenderTests -force-glcore -job-worker-count 2
          dockerCpuLimit: 2
          dockerMemoryLimit: 12g
      - name: Reject altered originals, missing or blank captures; package allowlist only
        id: package
        run: /usr/bin/python3 tasks/desert-rv/scripts/environment_emission_lifecycle_evidence.py package
      - name: Upload only sanitized environmental evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desert-rv-environment-emission-lifecycle-STRICT-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/desert-rv/evidence/environment-v4-r4/
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose phase deltas after every successful native render
        id: audit_diag
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: /usr/bin/python3 tasks/desert-rv/scripts/environment_v4_r4_audit.py diagnose --package-outcome '${{ steps.package.outcome }}'
      - name: Upload only sanitized phase audit and conditionally unvalidated native pixels
        if: ${{ !cancelled() && steps.audit_diag.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desert-rv-environment-emission-lifecycle-LIFECYCLE-DIAGNOSTIC-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/desert-rv/evidence/environment-v4-r4-audit/
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose protected source independently of image validation
        id: source_diag
        if: failure() && steps.snapshot.outcome == 'success'
        run: /usr/bin/python3 tasks/desert-rv/scripts/environment_evidence.py diagnose
      - name: Upload only independent source hash diagnosis
        if: failure() && steps.source_diag.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desert-rv-source-FAILED-NOT-ACCEPTED-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/desert-rv/evidence/environment-source-diagnostic/protected-source-failure.json
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose official Unity package resolution without raw files
        id: package_diag
        if: failure() && steps.source_diag.outputs.present == 'true'
        run: /usr/bin/python3 tasks/desert-rv/scripts/environment_evidence.py diagnose-packages
      - name: Upload only allowlisted Unity package metadata
        if: failure() && steps.package_diag.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desert-rv-packages-FAILED-NOT-ACCEPTED-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/desert-rv/evidence/environment-package-diagnostic/unity-package-resolution.json
          if-no-files-found: error
          retention-days: 7
